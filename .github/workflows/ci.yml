name: CI

# Run the test suite on every pull-request commit. No push trigger — work is
# always reviewed as a PR diff, and merges to main are handled by release.yml.
on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: api-printer-service/requirements.txt

      - name: Install dependencies
        working-directory: api-printer-service
        run: |
          python -m pip install --upgrade pip
          # pywin32/pystray/Pillow are guarded to sys_platform == "win32",
          # so on Linux only the cross-platform deps install.
          pip install -r requirements.txt pytest

      - name: Run tests
        working-directory: api-printer-service
        run: pytest tests/ -v
